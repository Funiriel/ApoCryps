  <main>

    <!-- HERO -->
    <section class="hero">

      <div 
        class="hero-bg active" 
        style="background-image: url('MarsHero1.jpg');">
      </div>

      <div 
        class="hero-bg" 
        style="background-image: url('MarsHero2.jpg');">
      </div>

      <div 
        class="hero-bg" 
        style="background-image: url('MarsHero3.jpg');">
      </div>

      <div class="hero-content">

        <h1 class="hero-title gradient-text">
          База на Марсі:<br>
          Перша постійна колонія
        </h1>

        <p class="hero-subtitle-big">
          Досліджуй. Живи. Процвітай на Червоній планеті.
        </p>

      </div>

    </section>

<!-- 3D MAP -->
<section class="mars-map">

  <canvas id="scene"></canvas>
 <div id="tooltip">
    <div class="tip-name"></div>
    <div class="tip-info"></div>
  </div>
</section>
  <footer>
    <section class="footer-section">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-left">
            <h2>Зв'яжись<br>з <span>ApoCryps</span></h2>
            <p>Хочеш стати частиною місії, маєш питання про відбір або просто хочеш слідкувати за прогресом — пиши нам.</p>
            <div class="social-row">
              <div class="social-btn">𝕏</div>
              <div class="social-btn">in</div>
              <div class="social-btn">▶</div>
            </div>
          </div>
          <div class="footer-right">
            <form id="contact-form">
              <input type="text" id="name" name="name" placeholder="Ваше ім'я" required>
              <input type="email" id="email" name="email" placeholder="Ваш email" required>
              <textarea id="message" name="message" placeholder="Ваше повідомлення або питання..." required></textarea>
              <button type="submit" id="submit-btn">Надіслати повідомлення</button>
            </form>
          </div>
        </div>
        
    </section>
  </footer>
