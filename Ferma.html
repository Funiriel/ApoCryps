<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>База «Ферма» на Марсі</title>
  <link rel="stylesheet" href="style5.css" />
</head>
<body>
  <header>
  <nav class="navbar">
    <div class="nav-container">
      <div class="Pic">
        <div class="logo">
          <span class="Apo">Apo</span><span class="Cryps">Cryps</span>
        </div>
      </div>
      <div class="nav-menu">
         <a href="index.html">Головна</a>
          <a href="Exp.html">Екіпаж</a>
          <a href="baza.html">База</a>
          <a href="kwiz.html">Квіз</a>
      </div>
    </div>
  </nav>
  </header>
  <main>
  <div class="map-container">
    <img class="map-bg" src="Baza2.png" alt="Mars Farm Base" draggable="false" />
    <div class="header">
      <div class="header-title">🌱 База «Ферма» — Вирощування та Добування</div>
      <div class="header-sub">Натисни на об'єкт, щоб дізнатися більше</div>
    </div>
    <button class="hotspot" style="left:20%;top:20%" data-id="greenhouse_big">
      <div class="hotspot-ring" style="border-color:#66bb6a;box-shadow:0 0 12px #66bb6a66">
        <span class="hotspot-icon">🌾</span>
      </div>
      <div class="hotspot-label">Велика Оранжерея</div>
    </button>
    <button class="hotspot" style="left:55%;top:15%" data-id="algae">
      <div class="hotspot-ring" style="border-color:#26c6da;box-shadow:0 0 12px #26c6da66">
        <span class="hotspot-icon">🧫</span>
      </div>
      <div class="hotspot-label">Водоростева Ферма</div>
    </button>
    <button class="hotspot" style="left:80%;top:25%" data-id="water_drill">
      <div class="hotspot-ring" style="border-color:#42a5f5;box-shadow:0 0 12px #42a5f566">
        <span class="hotspot-icon">💧</span>
      </div>
      <div class="hotspot-label">Водяна Свердловина</div>
    </button>
    <button class="hotspot" style="left:15%;top:55%" data-id="mine">
      <div class="hotspot-ring" style="border-color:#ff7043;box-shadow:0 0 12px #ff704366">
        <span class="hotspot-icon">⛏️</span>
      </div>
      <div class="hotspot-label">Шахта</div>
    </button>
    <button class="hotspot" style="left:42%;top:45%" data-id="refinery">
      <div class="hotspot-ring" style="border-color:#ffa726;box-shadow:0 0 12px #ffa72666">
        <span class="hotspot-icon">🏭</span>
      </div>
      <div class="hotspot-label">Переробний Завод</div>
    </button>
    <button class="hotspot" style="left:68%;top:50%" data-id="lab">
      <div class="hotspot-ring" style="border-color:#ab47bc;box-shadow:0 0 12px #ab47bc66">
        <span class="hotspot-icon">🔬</span>
      </div>
      <div class="hotspot-label">Лабораторія</div>
    </button>
    <button class="hotspot" style="left:30%;top:72%" data-id="robots">
      <div class="hotspot-ring" style="border-color:#78909c;box-shadow:0 0 12px #78909c66">
        <span class="hotspot-icon">🤖</span>
      </div>
      <div class="hotspot-label">Роботизований Склад</div>
    </button>
    <button class="hotspot" style="left:75%;top:70%" data-id="geo">
      <div class="hotspot-ring" style="border-color:#ef5350;box-shadow:0 0 12px #ef535066">
        <span class="hotspot-icon">🌋</span>
      </div>
      <div class="hotspot-label">Геотермальна Станція</div>
    </button>
    <div class="overlay" id="overlay"></div>
    <div class="info-panel" id="infoPanel">
      <button class="close-btn" id="closeBtn">×</button>
      <div class="panel-img-wrap" id="panelImgWrap">
        <img id="panelImg" src="" alt="" />
        <div class="panel-img-fade"></div>
        <div class="panel-img-icon" id="panelImgIcon"></div>
      </div>
      <div class="info-panel-body">
        <div class="info-panel-badge" id="panelBadge"></div>
        <div class="info-panel-title" id="panelTitle"></div>
        <div class="info-panel-subtitle" id="panelSubtitle"></div>
        <div class="info-panel-desc" id="panelDesc"></div>
        <div class="stats-section">
          <div class="stats-heading">Технічні характеристики</div>
          <div class="info-stats" id="panelStats"></div>
        </div>
      </div>
    </div>
  </div>
  </main>
    <footer>
    <section class="footer-section">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-left">
            <h2>Зв'яжись<br>з <span>ApoCryps</span></h2>
            <p>Хочеш стати частиною місії, маєш питання про відбір або просто хочеш слідкувати за прогресом — пиши нам.</p>
            <div class="social-row">
              <div class="social-btn">𝕏</div>
              <div class="social-btn">in</div>
              <div class="social-btn">▶</div>
            </div>
          </div>
          <div class="footer-right">
            <form id="contact-form">
              <input type="text" id="name" name="name" placeholder="Ваше ім'я" required>
              <input type="email" id="email" name="email" placeholder="Ваш email" required>
              <textarea id="message" name="message" placeholder="Ваше повідомлення або питання..." required></textarea>
              <button type="submit" id="submit-btn">Надіслати повідомлення</button>
            </form>
          </div>
        </div>
        
    </section>
  </footer>
  <script src="script5.js"></script>
</body>
</html>
